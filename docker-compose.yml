services:
  web:
    build: .
    command: >
      bash -lc "
        bundle exec rails db:prepare &&
        RAILS_ENV=test DATABASE_URL=postgres://postgres:password@db:5432/new_project_test bundle exec rails db:prepare &&
        bundle exec rails server -b 0.0.0.0
      "
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
      NODE_OPTIONS: --openssl-legacy-provider
    depends_on:
      - db
      - redis

  sidekiq:
    build: .
    command: bash -lc "bundle exec sidekiq"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
      NODE_OPTIONS: --openssl-legacy-provider
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  bundle_cache:
  node_modules:
